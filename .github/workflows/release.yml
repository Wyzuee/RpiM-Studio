name: Build and Release RpiM Studio

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/release-trigger'

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: 'utf-8'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup -y --no-progress
      - name: Build Windows installer
        shell: powershell
        run: python BUILD_RELEASE.py
      - name: Prepare release asset
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force release_upload | Out-Null
          Copy-Item installer_output\RpiM_Studio_Setup_v54.exe release_upload\RpiM_Studio_Setup.exe
      - uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: release_upload/RpiM_Studio_Setup.exe
          if-no-files-found: error

  macos:
    runs-on: macos-latest
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: 'utf-8'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build macOS DMG
        run: python3 BUILD_RELEASE.py
      - name: Verify CA bundle inside app
        run: |
          find dist/RpiMStudio.app -name cacert.pem -type f -print -quit | grep -q cacert.pem
      - name: Prepare release asset
        run: |
          mkdir -p release_upload
          cp release_output/RpiM_Studio_v54_macOS.dmg release_upload/RpiM_Studio_macOS.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: macos-release
          path: release_upload/RpiM_Studio_macOS.dmg
          if-no-files-found: error

  release:
    needs: [windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release_files
          merge-multiple: true
      - name: Publish v54 release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v54
          name: RπM Studio v54 - macOS TLS Fix
          make_latest: true
          generate_release_notes: true
          body: |
            macOS LIVE connection fix: the frozen app now bundles a Mozilla CA trust store via certifi and configures Python/OpenSSL to use it for HTTPS and WSS connections. Certificate verification remains enabled.
          files: |
            release_files/RpiM_Studio_Setup.exe
            release_files/RpiM_Studio_macOS.dmg
