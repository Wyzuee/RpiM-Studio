name: Bootstrap Source and Release

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bootstrap-release.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    if: ${{ hashFiles('bootstrap/source_bundle.tar.gz.b64') != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Restore source tree
        shell: bash
        run: |
          set -euo pipefail
          base64 -d bootstrap/source_bundle.tar.gz.b64 > /tmp/rpim-source.tar.gz
          tar -xzf /tmp/rpim-source.tar.gz -C .
          rm -rf bootstrap
          rm -f .github/workflows/bootstrap-release.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Publish RpiM Studio source' || true
          git push origin main

  windows:
    needs: bootstrap
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup -y --no-progress
      - name: Build Windows installer
        shell: powershell
        run: python BUILD_RELEASE.py
      - name: Prepare release asset
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force release_upload | Out-Null
          Copy-Item installer_output\RpiM_Studio_Setup_v53.exe release_upload\RpiM_Studio_Setup.exe
      - uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: release_upload/RpiM_Studio_Setup.exe

  macos:
    needs: bootstrap
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build macOS DMG
        run: python3 BUILD_RELEASE.py
      - name: Prepare release asset
        run: |
          mkdir -p release_upload
          cp release_output/RpiM_Studio_v53_macOS.dmg release_upload/RpiM_Studio_macOS.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: macos-release
          path: release_upload/RpiM_Studio_macOS.dmg

  release:
    needs: [windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release_files
          merge-multiple: true
      - name: Publish v53 release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v53
          name: RπM Studio v53
          make_latest: true
          generate_release_notes: true
          files: |
            release_files/RpiM_Studio_Setup.exe
            release_files/RpiM_Studio_macOS.dmg
